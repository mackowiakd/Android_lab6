<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista Życzeń</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #e0f7fa;
        }
        input[type=text] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            font-size: 18px;
        }
        button {
            background-color: #008CBA;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
        }
        button:hover { opacity: 0.8; }
        #lista {
            background-color: white;
            min-height: 100px;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
        }
        .prezent { border-bottom: 1px solid #eee; padding: 5px; }
    </style>
</head>
<body>

<h2 style="text-align:center; color:#006064;">Twoja lista do Mikołaja</h2>

<input type="text" id="nazwaPrezentu" placeholder="Wpisz prezent...">

<button onclick="dodajPrezent()">Dodaj</button>
<button onclick="generujKartke()" style="background-color: #f44336;">Generuj</button>

<h3>Lista prezentów:</h3>
<div id="lista"></div>

<script type="text/javascript">
    // --- TEGO FRAGMENTU BRAKOWAŁO W TWOIM PLIKU ---
    window.onload = function() {
        var input = document.getElementById("nazwaPrezentu");

        // Nasłuchuj klawisza Enter w polu tekstowym
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Zatrzymaj domyślne działanie
                dodajPrezent();         // Kliknij "Dodaj"
            }
        });
    }
    // ----------------------------------------------

    function dodajPrezent() {
        var pole = document.getElementById("nazwaPrezentu");
        var prezent = pole.value;

        if (prezent.length > 0) {
            // 1. Wyświetl na ekranie (HTML)
            var listaDiv = document.getElementById("lista");
            listaDiv.innerHTML += "<div class='prezent'>🎁 " + prezent + "</div>";

            // 2. Wyślij do Kotlina (ArrayList)
            // Upewnij się, że w Prezenty.kt masz: addJavascriptInterface(this, "Interfejs")
            try {
                Interfejs.dodajDoListy(prezent);
            } catch(e) {
                console.log("Błąd komunikacji z Kotlinem: " + e);
            }

            // 3. Wyczyść pole
            pole.value = "";
        }
    }

    function generujKartke() {
        try {
            Interfejs.idzDoKartki();
        } catch(e) {
            console.log("Błąd przejścia do kartki: " + e);
        }
    }
</script>

</body>
</html>
